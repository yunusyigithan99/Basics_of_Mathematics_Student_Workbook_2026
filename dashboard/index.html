<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematik Ödevi Çözüm & Sunum Portalı — Basics of Mathematics 2026</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  
  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      
      --text: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      
      --success-text: #065f46;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      
      --callout-bg: #f8fafc;
      --callout-border: #cbd5e1;
      
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header.top-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .top-nav-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 7px 12px 7px 32px;
      font-size: 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: all 0.15s ease;
    }

    .search-box input:focus {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--success-text);
    }

    .btn-secondary {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-body);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: var(--text-muted);
    }

    /* Layout: Sidebar + Main Content */
    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex: 1;
      width: 100%;
    }

    /* Left Sidebar */
    aside.sidebar {
      width: 340px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      height: calc(100vh - 61px);
      position: sticky;
      top: 61px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .sidebar-header h2 {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .topic-group {
      border-bottom: 1px solid var(--border);
    }

    .topic-header {
      padding: 10px 16px;
      background: var(--bg);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .topic-header:hover {
      background: #e2e8f0;
    }

    .topic-title-sub {
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .problem-list {
      list-style: none;
    }

    .problem-item {
      padding: 9px 16px 9px 24px;
      font-size: 0.82rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.1s ease;
      color: var(--text-body);
    }

    .problem-item:hover {
      background: var(--surface-subtle);
    }

    .problem-item.active {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      padding-left: 21px;
    }

    .problem-title-truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .badge-check {
      font-size: 0.75rem;
      color: #059669;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    /* Main Content Area */
    main.main-viewport {
      flex: 1;
      padding: 24px 36px 60px;
      overflow-y: auto;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Control Bar: Breadcrumbs, Navigation & View Toggles */
    .view-control-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb-nav {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb-nav span.active-node {
      color: var(--text);
      font-weight: 600;
    }

    .nav-arrows {
      display: flex;
      gap: 6px;
    }

    .nav-arrow-btn {
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-body);
      transition: all 0.15s ease;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: var(--surface-subtle);
      border-color: var(--border-strong);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .view-toggles-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .segmented-control {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: var(--radius-sm);
      gap: 2px;
    }

    .segmented-btn {
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .segmented-btn:hover {
      color: var(--text);
    }

    .segmented-btn.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Section Quick-Jump Bar */
    .section-pills-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    .sec-pill {
      white-space: nowrap;
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .sec-pill:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface-subtle);
    }

    /* Problem Presentation Card */
    .problem-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 36px;
      margin-bottom: 24px;
      position: relative;
    }

    .problem-header {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .problem-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .problem-meta {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Split View Container */
    .split-view-container {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
    }

    .split-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    .split-col-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Reading Mode Content Styling (Academic Paper Format) */
    .content-body {
      font-size: 1rem;
      color: var(--text-body);
      line-height: 1.7;
    }

    .content-body h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 28px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f5f9;
      letter-spacing: -0.01em;
    }

    .content-body h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .content-body p {
      margin-bottom: 14px;
    }

    .content-body ul, .content-body ol {
      margin-left: 24px;
      margin-bottom: 16px;
    }

    .content-body li {
      margin-bottom: 6px;
    }

    .content-body blockquote {
      border-left: 3px solid var(--border-strong);
      padding: 10px 16px;
      background: var(--surface-subtle);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 16px 0;
      font-style: italic;
      color: #475569;
    }

    .content-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.9rem;
    }

    .content-body th, .content-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .content-body th {
      background: var(--surface-subtle);
      font-weight: 600;
      color: var(--text);
    }

    .content-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: #1e293b;
    }

    .content-body pre {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      overflow-x: auto;
      margin: 16px 0;
    }

    .content-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* Math Formula Sizing */
    .katex-display {
      margin: 1.2em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }

    /* Specialized Pedagogical Cards */
    .callout-classroom {
      background: #fafaf9;
      border: 1px solid #e7e5e4;
      border-left: 4px solid #78716c;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin: 20px 0;
    }

    .callout-classroom-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #57534e;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .callout-answer {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4px solid #16a34a;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin: 20px 0;
    }

    .callout-answer-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #15803d;
      margin-bottom: 6px;
    }

    /* Source Code View */
    .source-code-container {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .source-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .source-toolbar .file-path {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }

    .source-code-editor {
      margin: 0;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #1e293b;
      background: #ffffff;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: calc(100vh - 280px);
    }

    /* Print Formatting */
    @media print {
      header.top-nav, aside.sidebar, .view-control-bar, .section-pills-bar, .nav-actions {
        display: none !important;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .app-container {
        display: block !important;
      }
      main.main-viewport {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .problem-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      aside.sidebar {
        width: 280px;
      }
      .split-view-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      aside.sidebar {
        display: none;
      }
      main.main-viewport {
        padding: 16px;
      }
      .search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="brand">
        <div class="brand-logo">&sum;</div>
        <div class="brand-text">
          <h1>Basics of Mathematics — Student Workbook 2026</h1>
          <p>Ödev İnceleme, Kaynak Kod & Sunum Portalı</p>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Live Search -->
        <div class="search-box">
          <span class="search-icon">&telrec;</span>
          <input type="text" id="searchInput" placeholder="Soru ara (ör: Limit, Matris, #12)..." autocomplete="off">
        </div>

        <!-- 100% Solved Badge -->
        <div class="progress-pill">
          <span>&check;</span>
          <span id="globalStatsText">180 / 180 Çözüldü (%100.0)</span>
        </div>

        <!-- Print Presentation Button -->
        <button class="btn-secondary" onclick="window.print()" title="Sayfayı yazdır veya PDF olarak kaydet">
          <span>&darr;</span> PDF / Yazdır
        </button>

        <a href="https://github.com/yunusyigithan99/Basics_of_Mathematics_Student_Workbook_2026" target="_blank" class="btn-secondary" title="GitHub Deposu">
          GitHub &rarr;
        </a>
      </div>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar / Question Navigator -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Müfredat ve Sorular</h2>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="sidebarTotalCount">180 Soru</span>
      </div>
      <div id="sidebarTree">
        <!-- Generated dynamically -->
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-viewport">
      
      <!-- View Control Bar -->
      <div class="view-control-bar">
        <div class="breadcrumb-nav">
          <span id="bcCategory">Calculus</span>
          <span>&rsaquo;</span>
          <span id="bcTopic">01 Limits</span>
          <span>&rsaquo;</span>
          <span class="active-node" id="bcProblem">Problem 01</span>
        </div>

        <div class="view-toggles-wrapper">
          <!-- Content Selector: Question vs Solution vs Split -->
          <div class="segmented-control" id="contentSelector">
            <button class="segmented-btn active" data-content="solution">
              <span>📖</span> Çözüm
            </button>
            <button class="segmented-btn" data-content="question">
              <span>❓</span> Soru
            </button>
            <button class="segmented-btn" data-content="split">
              <span>⚖️</span> Yan Yana
            </button>
          </div>

          <!-- Format Selector: Rendered Reading vs Raw Source Code -->
          <div class="segmented-control" id="formatSelector">
            <button class="segmented-btn active" data-format="render">
              <span>📄</span> Okuma Modu
            </button>
            <button class="segmented-btn" data-format="source">
              <span>💻</span> Kaynak Kod
            </button>
          </div>

          <!-- Prev / Next Navigation -->
          <div class="nav-arrows">
            <button class="nav-arrow-btn" id="btnPrevProblem" title="Önceki Soru (Sol Ok tuşu)">
              &larr; Önceki
            </button>
            <button class="nav-arrow-btn" id="btnNextProblem" title="Sonraki Soru (Sağ Ok tuşu)">
              Sonraki &rarr;
            </button>
          </div>
        </div>
      </div>

      <!-- Section Navigation Pills (Jumps to 9 standard sections in Reading Mode) -->
      <div class="section-pills-bar" id="sectionPillsBar">
        <button class="sec-pill" onclick="jumpToSection(1)">1. Orijinal Soru</button>
        <button class="sec-pill" onclick="jumpToSection(2)">2. Ne Arıyoruz?</button>
        <button class="sec-pill" onclick="jumpToSection(3)">3. Teoremler</button>
        <button class="sec-pill" onclick="jumpToSection(4)">4. Adım Adım Çözüm</button>
        <button class="sec-pill" onclick="jumpToSection(5)">5. Neden Geçerli?</button>
        <button class="sec-pill" onclick="jumpToSection(6)">6. Nihai Cevap</button>
        <button class="sec-pill" onclick="jumpToSection(7)">7. Sağlama</button>
        <button class="sec-pill" onclick="jumpToSection(8)">8. Sık Hatalar</button>
        <button class="sec-pill" onclick="jumpToSection(9)">9. Sınıf Sunumu</button>
      </div>

      <!-- Display Container: Renders Either Single Card, Split View, or Source View -->
      <div id="displayContainer">
        <!-- Dynamically injected -->
      </div>

    </main>
  </div>

  <script>
    // State
    let appData = null;
    let allProblemsFlat = [];
    let currentProblemIndex = 0;
    let currentContentMode = 'solution'; // 'solution' | 'question' | 'split'
    let currentFormatMode = 'render';   // 'render' | 'source'

    // Load initial data
    async function loadData() {
      try {
        const res = await fetch('/data.json');
        appData = await res.json();
        
        // Flatten problems for easy sequential navigation
        allProblemsFlat = [];
        for (const [secKey, sec] of Object.entries(appData.sections)) {
          for (const topic of sec.topics) {
            for (const prob of topic.problems) {
              allProblemsFlat.push(prob);
            }
          }
        }

        renderSidebar();
        selectProblem(0);
      } catch (err) {
        console.error('Failed to load data.json:', err);
      }
    }

    // Render left sidebar tree
    function renderSidebar(filteredList = null) {
      const container = document.getElementById('sidebarTree');
      container.innerHTML = '';

      if (filteredList !== null) {
        // Search Results Mode
        const searchGroup = document.createElement('div');
        searchGroup.className = 'topic-group';
        searchGroup.innerHTML = `<div class="topic-header">Arama Sonuçları (${filteredList.length})</div>`;
        const ul = document.createElement('ul');
        ul.className = 'problem-list';

        filteredList.forEach(prob => {
          const globalIdx = allProblemsFlat.findIndex(p => p.id === prob.id);
          const li = document.createElement('li');
          li.className = `problem-item ${globalIdx === currentProblemIndex ? 'active' : ''}`;
          li.innerHTML = `
            <div class="problem-title-truncate"><strong>#${prob.num}</strong> ${prob.title.replace(/^Problem\s+\d+:\s*/, '')}</div>
            <span class="badge-check">&check;</span>
          `;
          li.onclick = () => selectProblem(globalIdx);
          ul.appendChild(li);
        });
        searchGroup.appendChild(ul);
        container.appendChild(searchGroup);
        return;
      }

      // Standard Category & Topic Tree
      for (const [secKey, sec] of Object.entries(appData.sections)) {
        const secHeader = document.createElement('div');
        secHeader.className = 'topic-header';
        secHeader.innerHTML = `<span>${sec.name}</span> <span style="font-weight:400; opacity:0.8;">${sec.topics.length} Konu</span>`;
        container.appendChild(secHeader);

        sec.topics.forEach(topic => {
          const topicSub = document.createElement('div');
          topicSub.className = 'topic-title-sub';
          topicSub.innerHTML = `<span>${topic.title}</span> <span style="color:var(--text-muted); font-size:0.75rem;">${topic.problems.length} Soru</span>`;
          container.appendChild(topicSub);

          const ul = document.createElement('ul');
          ul.className = 'problem-list';

          topic.problems.forEach(prob => {
            const globalIdx = allProblemsFlat.findIndex(p => p.id === prob.id);
            const li = document.createElement('li');
            li.className = `problem-item ${globalIdx === currentProblemIndex ? 'active' : ''}`;
            li.id = `sidebar-item-${globalIdx}`;
            
            // Clean title
            const shortTitle = prob.title.replace(/^Problem\s+\d+:\s*/, '');
            li.innerHTML = `
              <div class="problem-title-truncate"><strong>#${String(prob.num).padStart(2, '0')}</strong> ${shortTitle}</div>
              <span class="badge-check" title="Çözüldü">&check;</span>
            `;
            li.onclick = () => selectProblem(globalIdx);
            ul.appendChild(li);
          });

          container.appendChild(ul);
        });
      }
    }

    // Select problem by index
    function selectProblem(index) {
      if (index < 0 || index >= allProblemsFlat.length) return;
      currentProblemIndex = index;
      const prob = allProblemsFlat[currentProblemIndex];

      // Update Breadcrumbs
      document.getElementById('bcCategory').textContent = prob.category_name.split(' ')[0];
      document.getElementById('bcTopic').textContent = prob.topic_title;
      document.getElementById('bcProblem').textContent = `Problem ${String(prob.num).padStart(2, '0')}`;

      // Update Nav Buttons
      document.getElementById('btnPrevProblem').disabled = (currentProblemIndex === 0);
      document.getElementById('btnNextProblem').disabled = (currentProblemIndex === allProblemsFlat.length - 1);

      // Update active class in sidebar
      document.querySelectorAll('.problem-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.getElementById(`sidebar-item-${currentProblemIndex}`);
      if (activeItem) {
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      // Render Viewport
      renderMainContent();
    }

    // Render the main presentation view
    function renderMainContent() {
      const prob = allProblemsFlat[currentProblemIndex];
      const container = document.getElementById('displayContainer');
      const pillsBar = document.getElementById('sectionPillsBar');

      // Visibility of pills bar: only in solution rendered mode
      pillsBar.style.display = (currentContentMode === 'solution' && currentFormatMode === 'render') ? 'flex' : 'none';

      // 1. RAW SOURCE CODE MODE
      if (currentFormatMode === 'source') {
        let rawCode = '';
        let fileLabel = prob.path;

        if (currentContentMode === 'question') {
          rawCode = `### Problem ${prob.num}\n\n${prob.question_md}`;
          fileLabel = `exercises/${prob.category_id}/${prob.topic_id}_en.md`;
        } else {
          rawCode = prob.solution_md;
          fileLabel = prob.path;
        }

        const lineCount = rawCode.split('\n').length;
        const charCount = rawCode.length;

        container.innerHTML = `
          <div class="source-code-container">
            <div class="source-toolbar">
              <span class="file-path">${fileLabel}</span>
              <div style="display:flex; align-items:center; gap:12px;">
                <span>${lineCount} satır &bull; ${charCount} karakter</span>
                <button class="btn-secondary" style="padding:4px 10px; font-size:0.75rem;" onclick="copyRawCode()">
                  Kodu Kopyala
                </button>
              </div>
            </div>
            <pre class="source-code-editor" id="rawCodeBlock"><code>${escapeHtml(rawCode)}</code></pre>
          </div>
        `;
        return;
      }

      // 2. SPLIT VIEW (Question on Left, Solution on Right)
      if (currentContentMode === 'split') {
        container.innerHTML = `
          <div class="split-view-container">
            <!-- Left: Question -->
            <div class="split-col">
              <div class="split-col-header">
                <span>❓ Orijinal Soru (Workbook Problem)</span>
                <span style="font-weight:400; font-size:0.78rem;">#${prob.num}</span>
              </div>
              <div class="content-body" id="renderedQuestionSplit">
                ${formatMarkdownWithMath(prob.question_md)}
              </div>
            </div>

            <!-- Right: Solution -->
            <div class="split-col">
              <div class="split-col-header">
                <span>📖 9 Adımlı Tam Çözüm</span>
                <span class="badge-check">&check; Doğrulandı</span>
              </div>
              <div class="content-body" id="renderedSolutionSplit">
                ${formatMarkdownWithMath(prob.solution_md)}
              </div>
            </div>
          </div>
        `;

        renderMath(document.getElementById('renderedQuestionSplit'));
        renderMath(document.getElementById('renderedSolutionSplit'));
        return;
      }

      // 3. SINGLE CARD RENDERED VIEW (Either Question or Solution)
      const isQuestionOnly = (currentContentMode === 'question');
      const textToRender = isQuestionOnly ? `### Problem ${prob.num}\n\n${prob.question_md}` : prob.solution_md;

      container.innerHTML = `
        <div class="problem-card">
          <div class="problem-header">
            <h2>${prob.title}</h2>
            <div class="problem-meta">
              <span><strong>Ders Alanı:</strong> ${prob.category_name}</span>
              <span><strong>Konu:</strong> ${prob.topic_title}</span>
              <span><strong>Soru No:</strong> ${prob.num} / 15</span>
              <span><strong>Format:</strong> 9 Maddeli Pedagojik Şablon</span>
            </div>
          </div>
          <div class="content-body" id="renderedCardContent">
            ${formatMarkdownWithMath(textToRender)}
          </div>
        </div>
      `;

      renderMath(document.getElementById('renderedCardContent'));
      stylePedagogicalBoxes();
    }

    // Helper: Convert Markdown to HTML using Marked
    function formatMarkdownWithMath(mdText) {
      if (!mdText) return '<p><em>İçerik bulunamadı.</em></p>';
      
      // Configure marked
      marked.setOptions({
        gfm: true,
        breaks: true
      });

      return marked.parse(mdText);
    }

    // Render KaTeX Math in a container element
    function renderMath(element) {
      if (!element || typeof renderMathInElement === 'undefined') return;
      try {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false
        });
      } catch (e) {
        console.warn('KaTeX render warning:', e);
      }
    }

    // Add styling wrappers to Section 9 (Classroom presentation) and Section 6 (Final answer)
    function stylePedagogicalBoxes() {
      const card = document.getElementById('renderedCardContent');
      if (!card) return;

      card.querySelectorAll('h2').forEach(h2 => {
        const text = h2.textContent;
        
        // Section 9: Classroom summary
        if (text.includes('9.') && text.includes('Classroom Presentation')) {
          const box = document.createElement('div');
          box.className = 'callout-classroom';
          box.id = 'sec-jump-9';
          box.innerHTML = `<div class="callout-classroom-title">🗣️ Sınıf İçi Sözlü Sunum (3 Cümlelik Özet)</div>`;
          
          let next = h2.nextElementSibling;
          h2.parentNode.insertBefore(box, h2);
          box.appendChild(h2);
          while (next && next.tagName !== 'H2') {
            const current = next;
            next = next.nextElementSibling;
            box.appendChild(current);
          }
        }
        
        // Section 6: Final Answer
        else if (text.includes('6.') && text.includes('Final Answer')) {
          const box = document.createElement('div');
          box.className = 'callout-answer';
          box.id = 'sec-jump-6';
          box.innerHTML = `<div class="callout-answer-title">🎯 Sözlü Nihai Cevap</div>`;
          
          let next = h2.nextElementSibling;
          h2.parentNode.insertBefore(box, h2);
          box.appendChild(h2);
          while (next && next.tagName !== 'H2') {
            const current = next;
            next = next.nextElementSibling;
            box.appendChild(current);
          }
        }

        // Add IDs for quick jumps
        for (let i = 1; i <= 8; i++) {
          if (text.startsWith(`${i}.`)) {
            h2.id = `sec-jump-${i}`;
          }
        }
      });
    }

    // Smooth scroll jump to numbered section
    function jumpToSection(num) {
      const target = document.getElementById(`sec-jump-${num}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Escape HTML for code block
    function escapeHtml(string) {
      const entityMap = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };
      return String(string).replace(/[&<>"']/g, s => entityMap[s]);
    }

    // Copy raw source code
    function copyRawCode() {
      const block = document.getElementById('rawCodeBlock');
      if (!block) return;
      navigator.clipboard.writeText(block.innerText).then(() => {
        alert('Kaynak kod panoya kopyalandı!');
      });
    }

    // Event Listeners: Content Mode buttons (Solution vs Question vs Split)
    document.querySelectorAll('#contentSelector .segmented-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#contentSelector .segmented-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentContentMode = btn.dataset.content;
        renderMainContent();
      });
    });

    // Event Listeners: Format Mode buttons (Rendered vs Source)
    document.querySelectorAll('#formatSelector .segmented-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#formatSelector .segmented-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFormatMode = btn.dataset.format;
        renderMainContent();
      });
    });

    // Prev / Next button click handlers
    document.getElementById('btnPrevProblem').addEventListener('click', () => {
      selectProblem(currentProblemIndex - 1);
    });

    document.getElementById('btnNextProblem').addEventListener('click', () => {
      selectProblem(currentProblemIndex + 1);
    });

    // Keyboard Shortcuts: ArrowLeft and ArrowRight
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') {
        selectProblem(currentProblemIndex - 1);
      } else if (e.key === 'ArrowRight') {
        selectProblem(currentProblemIndex + 1);
      }
    });

    // Real-time Search Handler
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderSidebar();
        return;
      }

      const filtered = allProblemsFlat.filter(p => {
        return (
          p.title.toLowerCase().includes(query) ||
          p.topic_title.toLowerCase().includes(query) ||
          p.category_name.toLowerCase().includes(query) ||
          `#${p.num}`.includes(query) ||
          `problem ${p.num}`.includes(query) ||
          p.solution_md.toLowerCase().includes(query)
        );
      });

      renderSidebar(filtered);
    });

    // Initial boot
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
